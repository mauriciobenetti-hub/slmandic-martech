<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plano de entregas HubSpot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style id="css">
:root{
  --navy:#1A2459; --navy-2:#2A367A; --navy-3:#3A4799; --gold:#F5C518; --gold-ink:#1A2459;
  --bg:#F3F4F8; --surface:#FFFFFF; --ink:#141A3A; --ink-2:#5A6080; --line:#DDE0EA;
  --done-ink:#8A90AA; --pill-run:#E2EEFF; --pill-run-ink:#1D4ED8; --pill-wait:#EEF0F5; --pill-wait-ink:#5A6080;
  --pill-done:#FFF1B8; --pill-done-ink:#6B5300; --card-shadow:0 1px 2px rgba(20,26,58,.06);
  --a-grad:#2BA6A6; --a-pgmed:#4C63D2; --a-pgo:#E0A800; --a-cx:#9B59B6; --a-mkt:#E8734A; --a-proc:#3FA66B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0D1230; --surface:#182051; --ink:#F2F3F8; --ink-2:#A7ADCC; --line:#2C3670;
  --done-ink:#6F76A0; --pill-run:#223274; --pill-run-ink:#9EB8FF; --pill-wait:#232B5E; --pill-wait-ink:#A7ADCC;
  --pill-done:#4A3C06; --pill-done-ink:#F5C518; --card-shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0D1230; --surface:#182051; --ink:#F2F3F8; --ink-2:#A7ADCC; --line:#2C3670;
  --done-ink:#6F76A0; --pill-run:#223274; --pill-run-ink:#9EB8FF; --pill-wait:#232B5E; --pill-wait-ink:#A7ADCC;
  --pill-done:#4A3C06; --pill-done-ink:#F5C518; --card-shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:inherit} html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
button{font:inherit;color:inherit}
.hero{background:var(--navy);color:#fff;padding:28px 24px 24px}
.hero-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:16px 32px;align-items:end}
h1{font:700 26px/1.1 "Space Grotesk",Inter,sans-serif;margin:0 0 6px;letter-spacing:-.01em}
.hero p{margin:0;color:#C9CEE6;font-size:14px}
.score{text-align:right}
.score b{display:block;font:500 34px/1 "JetBrains Mono",ui-monospace,monospace;color:var(--gold)}
.score span{font-size:13px;color:#C9CEE6}
.bar{grid-column:1/-1;height:8px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .35s ease}
.wrap{max-width:1180px;margin:0 auto;padding:18px 24px 80px}
.tools{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-bottom:20px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{border-color:var(--navy);color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--navy)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--dot,var(--navy))}
.toggle{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--navy)}
button:focus-visible,input:focus-visible,.row:focus-within,.card:focus-within{outline:2px solid var(--gold);outline-offset:2px}

/* checkbox */
.ck{position:relative;flex:0 0 auto;width:22px;height:22px}
.ck input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;width:100%;height:100%}
.ck span{position:absolute;inset:0;border:2px solid var(--navy-3);border-radius:6px;background:var(--surface);transition:background .15s,border-color .15s}
.ck span::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--gold-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);transition:transform .15s}
.ck input:checked + span{background:var(--gold);border-color:var(--gold)}
.ck input:checked + span::after{transform:rotate(45deg) scale(1)}
.ck input:disabled + span{opacity:.5}

/* list */
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden;box-shadow:var(--card-shadow)}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);border-left:4px solid var(--dot)}
.ghead h2{font:700 16px/1.2 "Space Grotesk",Inter,sans-serif;margin:0}
.ghead small{margin-left:auto;font:500 12px "JetBrains Mono",ui-monospace,monospace;color:var(--ink-2)}
.pills{display:inline-flex;gap:6px}
.row{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.row:hover{background:color-mix(in srgb,var(--surface) 92%,var(--navy))}
.row .t{min-width:0}
.row.done .t{color:var(--done-ink);text-decoration:line-through;text-decoration-color:var(--done-ink)}
.date{font:500 12.5px "JetBrains Mono",ui-monospace,monospace;color:var(--ink-2);white-space:nowrap}
.pill{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.run{background:var(--pill-run);color:var(--pill-run-ink)}
.pill.wait{background:var(--pill-wait);color:var(--pill-wait-ink)}
.pill.ok{background:var(--pill-done);color:var(--pill-done-ink)}
.pill.lab{background:transparent;border:1px solid var(--a-cx);color:var(--a-cx)}
.export{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px;color:var(--ink);display:none}
.export.on{display:inline-flex}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:color-mix(in srgb,var(--surface) 55%,var(--bg));border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px}
.col.today{border-color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.chead{display:flex;align-items:baseline;gap:8px;padding:6px 6px 12px}
.chead b{font:700 20px/1 "Space Grotesk",Inter,sans-serif}
.chead em{font-style:normal;font-size:13px;color:var(--ink-2)}
.chead .tag{font-size:11px;font-weight:600;background:var(--gold);color:var(--gold-ink);padding:2px 7px;border-radius:999px}
.chead small{margin-left:auto;font:500 12px "JetBrains Mono",ui-monospace,monospace;color:var(--ink-2)}
.card{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--dot);border-radius:10px;padding:10px 12px 10px 10px;margin-bottom:8px;cursor:pointer;box-shadow:var(--card-shadow)}
.card .a{font-size:11.5px;font-weight:600;color:var(--dot);margin-bottom:3px}
.card .t{font-size:14px;line-height:1.35}
.card .m{margin-top:6px;display:flex;gap:8px;align-items:center}
.card.done{opacity:.55}
.card.done .t{text-decoration:line-through}
.empty{padding:20px 8px;text-align:center;color:var(--ink-2);font-size:13px}
.status{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(20,26,58,.25);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:none}
.status.on{opacity:1;transform:none}
@media (max-width:720px){
  .hero{padding:20px 16px 18px} .hero-in{grid-template-columns:1fr auto} h1{font-size:21px} .score b{font-size:26px}
  .wrap{padding:14px 12px 90px} .row{grid-template-columns:auto 1fr;row-gap:4px} .row .date,.row .pill{grid-column:2;justify-self:start}
  .board{grid-template-columns:repeat(4,78vw)} .toggle{margin-left:0}
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>
<script id="data" type="application/json">{"tasks":[{"id":"g1","area":"grad","title":"Melhoria do bot para novos atendimentos específicos (Enem/Prova) com árvore tripla","date":"19/10","status":"run"},{"id":"g2","area":"grad","title":"Nova ficha de matrícula (testes e validações) com as áreas envolvidas","date":"15/10","status":"run"},{"id":"g3","area":"grad","title":"Inclusão da integração da nova ficha de matrícula","date":"20/10","status":"run"},{"id":"g4","area":"grad","title":"Ajustes de front-end da ficha de matrícula","date":"19/10","status":"wait"},{"id":"g5","area":"grad","title":"2º teste da ficha com dados reais","date":"20/10","status":"wait"},{"id":"m1","area":"pgmed","title":"Refatoração do HubSpot trabalhando com 2 funis","date":"15/10","status":"run"},{"id":"m2","area":"pgmed","title":"Treinamento com a equipe de PGMED","date":"19/10","status":"wait"},{"id":"m3","area":"pgmed","title":"Virada da base do RD para o HubSpot","date":"19/10","status":"wait"},{"id":"m4","area":"pgmed","title":"Migração dos números para o Spread","date":"20/10","status":"wait"},{"id":"m5","area":"pgmed","title":"Retreinamento do Spreadchat no HubSpot","date":"19/10","status":"wait"},{"id":"o1","area":"pgo","title":"Validação do checkout pelas BUs","date":"16/10","status":"run"},{"id":"o2","area":"pgo","title":"Finalização das views no HubSpot","date":"16/10","status":"run"},{"id":"o3","area":"pgo","title":"Importar base histórica","date":"20/10","status":"wait"},{"id":"o4","area":"pgo","title":"Migração do número para o Spread","date":"20/10","status":"wait"},{"id":"o5","area":"pgo","title":"Utilização da ferramenta por 2/3 dias","date":"20/10","status":"wait"},{"id":"c1","area":"cx","title":"Inclusão da base histórica de tickets do Zendesk no HubSpot","date":"15/10","status":"run"},{"id":"c2","area":"cx","title":"Treinamento das áreas faltantes","date":"20/10","status":"wait"},{"id":"c3","area":"cx","title":"Virada das unidades adjacentes (Grande Vitória / BH / Curitiba)","date":"20/10","status":"run"},{"id":"c4","area":"cx","title":"Aplicação do magic link do Conecta (paliativo para ver histórico)","date":"15/10","status":"run"},{"id":"c5","area":"cx","title":"Apoio e treinamento para comunicação com o aluno via HubSpot","date":"15/10","status":"run"},{"id":"c6","area":"cx","title":"Retirada do magic link do Conecta","date":"19/10","status":"wait"},{"id":"c7","area":"cx","title":"Cadastrar novo número para disparo de comunicações","date":"20/10","status":"wait","label":"Melhoria"},{"id":"k1","area":"mkt","title":"Nova ficha de matrícula (testes e validações) com as áreas envolvidas","date":"15/10","status":"run"},{"id":"k2","area":"mkt","title":"Treinamento da operacionalização do processo de matrícula no HubSpot","date":"16/10","status":"wait"},{"id":"p1","area":"proc","title":"Finalização dos procedimentos operacionais das BUs e áreas adjacentes","date":"20/10","status":"run"},{"id":"p2","area":"proc","title":"Validação dos procedimentos operacionais das BUs","date":"20/10","status":"run"},{"id":"p3","area":"proc","title":"Apresentação e envio dos procedimentos de cada área","date":"20/10","status":"run"}],"done":{"g2":true,"m1":true,"o2":true,"c1":true,"c4":true,"k1":true,"m2":true}}</script>
<div id="app"></div>
<script id="js">
(function(){
  var state = JSON.parse(document.getElementById('data').textContent);
  var AREAS = [
    ['grad','Graduação','--a-grad'],['pgmed','PG Medicina','--a-pgmed'],['pgo','PG Odonto','--a-pgo'],
    ['cx','Atendimento ao Aluno / CX','--a-cx'],['mkt','Marketing Ops','--a-mkt'],['proc','Processos','--a-proc']
  ];
  var AREA = {}; AREAS.forEach(function(a){ AREA[a[0]] = {name:a[1], dot:'var('+a[2]+')'}; });
  var DATES = ['15/10','16/10','19/10','20/10'];
  var WEEK = {'15/10':'qui','16/10':'sex','19/10':'seg','20/10':'ter'};
  var TODAY = '15/10';
  var PREF_KEY = 'mandic-plano-prefs', DONE_KEY = 'mandic-plano-done';
  var prefs = {view:'lista', area:'all', hideDone:false};
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY) || '{}')); } catch(e){}
  var art = null, artResolved = false, readOnly = false, saving = false, timer = null, dirty = false;
  var app = document.getElementById('app');

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function visible(t){ return (prefs.area==='all' || t.area===prefs.area) && !(prefs.hideDone && state.done[t.id]); }
  function isDone(t){ return !!state.done[t.id]; }
  function pill(t){
    var lab = t.label ? '<span class="pill lab">'+esc(t.label)+'</span>' : '';
    if (isDone(t)) return lab+'<span class="pill ok">Feito</span>';
    return lab+(t.status==='run' ? '<span class="pill run">Em andamento</span>' : '<span class="pill wait">A iniciar</span>');
  }
  function ck(t){
    return '<label class="ck" onclick="event.stopPropagation()"><input type="checkbox" data-id="'+t.id+'" '+(isDone(t)?'checked':'')+(saving||readOnly?' disabled':'')+' aria-label="Concluído: '+esc(t.title)+'"><span></span></label>';
  }
  function sortDone(list){ return list.slice().sort(function(a,b){ return (isDone(a)?1:0)-(isDone(b)?1:0); }); }

  function render(){
    var total = state.tasks.length, done = state.tasks.filter(isDone).length;
    var pct = total ? Math.round(done/total*100) : 0;
    var h = '';
    h += '<header class="hero"><div class="hero-in"><div><h1>Plano de entregas HubSpot</h1><p>15 a 20 de outubro de 2026</p></div>';
    h += '<div class="score"><b>'+done+'/'+total+'</b><span>entregas concluídas</span></div>';
    h += '<div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div></div></header>';
    h += '<main class="wrap"><div class="tools">';
    h += '<div class="seg" role="group" aria-label="Visão"><button data-view="lista" aria-pressed="'+(prefs.view==='lista')+'">Lista</button><button data-view="kanban" aria-pressed="'+(prefs.view==='kanban')+'">Kanban</button></div>';
    h += '<div class="chips"><button class="chip" data-area="all" aria-pressed="'+(prefs.area==='all')+'">Todas as áreas</button>';
    AREAS.forEach(function(a){ h += '<button class="chip" data-area="'+a[0]+'" aria-pressed="'+(prefs.area===a[0])+'" style="--dot:var('+a[2]+')"><i></i>'+a[1]+'</button>'; });
    h += '</div><label class="toggle"><input type="checkbox" id="hideDone" '+(prefs.hideDone?'checked':'')+'> Ocultar concluídos</label>'
      + '<button class="export'+(artResolved && !art ? ' on' : '')+'" id="export" type="button">Baixar HTML atualizado</button></div>';
    h += prefs.view==='lista' ? renderList() : renderBoard();
    h += '</main><div class="status" id="status"></div>';
    app.innerHTML = h;
    setStatus();
  }

  function renderList(){
    var h = '';
    AREAS.forEach(function(a){
      var all = state.tasks.filter(function(t){ return t.area===a[0]; });
      var list = sortDone(all.filter(visible));
      if (!list.length) return;
      var d = all.filter(isDone).length;
      h += '<section class="group" style="--dot:var('+a[2]+')"><div class="ghead"><h2>'+a[1]+'</h2><small>'+d+' de '+all.length+'</small></div>';
      list.forEach(function(t){
        h += '<div class="row'+(isDone(t)?' done':'')+'" data-row="'+t.id+'">'+ck(t)+'<div class="t">'+esc(t.title)+'</div><span class="date">'+t.date+'</span><span class="pills">'+pill(t)+'</span></div>';
      });
      h += '</section>';
    });
    return h || '<p class="empty">Nada para mostrar com os filtros atuais.</p>';
  }

  function renderBoard(){
    var h = '<div class="board">';
    DATES.forEach(function(dt){
      var all = state.tasks.filter(function(t){ return t.date===dt; });
      var list = sortDone(all.filter(visible));
      var d = all.filter(isDone).length;
      h += '<section class="col'+(dt===TODAY?' today':'')+'"><div class="chead"><b>'+dt.slice(0,2)+'/10</b><em>'+WEEK[dt]+'</em>'+(dt===TODAY?'<span class="tag">Hoje</span>':'')+'<small>'+d+'/'+all.length+'</small></div>';
      if (!list.length) h += '<p class="empty">Sem itens</p>';
      list.forEach(function(t){
        var a = AREA[t.area];
        h += '<article class="card'+(isDone(t)?' done':'')+'" data-row="'+t.id+'" style="--dot:'+a.dot+'">'+ck(t)+'<div><div class="a">'+a.name+'</div><div class="t">'+esc(t.title)+'</div><div class="m">'+pill(t)+'</div></div></article>';
      });
      h += '</section>';
    });
    return h + '</div>';
  }

  function setStatus(){
    var el = document.getElementById('status'); if (!el) return;
    var msg = saving ? 'Salvando…' : readOnly ? 'Somente leitura' : '';
    el.textContent = msg; el.classList.toggle('on', !!msg);
  }
  function savePrefs(){ try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch(e){} }

  function toggle(id){
    if (saving || readOnly) return;
    if (state.done[id]) delete state.done[id]; else state.done[id] = true;
    render();
    persist();
  }

  function buildPage(s){
    var css = document.getElementById('css').textContent;
    var js = document.getElementById('js').textContent;
    var json = JSON.stringify(s).replace(/</g, '\\u003c');
    return '<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n'
      + '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
      + '<title>Plano de entregas HubSpot</title>\n'
      + '<link rel="preconnect" href="https://fonts.googleapis.com">\n'
      + '<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">\n'
      + '<style id="css">' + css + '<\/style>\n</head>\n<body>\n'
      + '<script id="data" type="application/json">' + json + '<\/script>\n'
      + '<div id="app"></div>\n'
      + '<script id="js">' + js + '<\/script>\n</body>\n</html>';
  }

  function persist(){
    if (!artResolved){ dirty = true; return; }
    dirty = false;
    if (!art){ try { localStorage.setItem(DONE_KEY, JSON.stringify(state.done)); } catch(e){} return; }
    clearTimeout(timer);
    timer = setTimeout(function(){
      saving = true; render();
      art.publish(buildPage({tasks: state.tasks, done: state.done})).then(function(){
        // the view reloads to the new version
      }).catch(function(err){
        var code = err && err.code;
        if (code==='not_writer' || code==='not_granted' || code==='not_declared' || code==='consent_required' || code==='capability_disabled') readOnly = true;
        saving = false; render();
      });
    }, 1200);
  }

  app.addEventListener('change', function(e){
    var t = e.target;
    if (t.id==='hideDone'){ prefs.hideDone = t.checked; savePrefs(); render(); return; }
    if (t.dataset.id) toggle(t.dataset.id);
  });
  app.addEventListener('click', function(e){
    var b = e.target.closest('[data-view]'); if (b){ prefs.view = b.dataset.view; savePrefs(); render(); return; }
    var c = e.target.closest('[data-area]'); if (c){ prefs.area = c.dataset.area; savePrefs(); render(); return; }
    if (e.target.closest('#export')){ exportHtml(); return; }
    var r = e.target.closest('[data-row]'); if (r && !e.target.closest('.ck')) toggle(r.dataset.row);
  });

  function exportHtml(){
    var blob = new Blob([buildPage({tasks: state.tasks, done: state.done})], {type:'text/html'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'plano-hubspot-outubro.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
  }

  render();

  if (window.claude && typeof window.claude.use==='function'){
    window.claude.use('artifact').then(function(ns){
      art = ns; artResolved = true;
      if (!art && !dirty){ try { var d = JSON.parse(localStorage.getItem(DONE_KEY) || 'null'); if (d) { state.done = d; } } catch(e){} }
      render();
      if (dirty) persist();
    });
  } else {
    artResolved = true;
    try { var d = JSON.parse(localStorage.getItem(DONE_KEY) || 'null'); if (d) { state.done = d; } } catch(e){}
    render();
  }
})();
</script>
</body>
</html>
